version: "3.8"

services:
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: yt-tracker-worker
    restart: unless-stopped
    env_file:
      - ./worker/.env
    volumes:
      - worker-logs:/var/log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  worker-logs:
